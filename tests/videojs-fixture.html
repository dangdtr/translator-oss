<!doctype html><html lang="en"><meta charset="utf-8"><title>Video.js emulated captions</title>
<link rel="stylesheet" href="/vendor/video-js.css">
<style>body{margin:0} .video-js{width:640px;height:360px}</style>
<video id="vjs_video_3" class="video-js" controls muted></video>
<canvas id="canvas" width="640" height="360" hidden></canvas>
<!-- An unrelated player must never supply captions for the selected video. -->
<div class="video-js" id="decoy"><video></video><div class="vjs-text-track-display"><div class="vjs-text-track-cue" lang="en">WRONG PLAYER CAPTION</div></div></div>
<script src="/vendor/video.min.js"></script><script>
const canvas = document.querySelector('canvas'), ctx = canvas.getContext('2d');
const draw = () => {ctx.fillStyle = '#24324a';ctx.fillRect(0,0,640,360);};
draw(); setInterval(draw, 100);
const player = videojs('vjs_video_3', {html5: {nativeTextTracks: false}, textTrackSettings: false});
player.ready(async () => {
  const video = player.el().querySelector('video');
  video.srcObject = canvas.captureStream(10);
  const track = player.addTextTrack('captions', 'English', 'en');
  track.addCue(new VTTCue(0, 300, "that's important to keep in mind."));
  track.mode = 'showing';
  // Canvas streams have no URL for Video.js's source middleware; drive the
  // HTML5 tech directly while using the real Video.js text-track renderer.
  await video.play();
  video.pause();
  window.fixturePlayer = player;
  window.fixtureReady = true;
});
</script></html>
